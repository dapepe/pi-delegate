name: Validate pi

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install pinned SDK without lifecycle scripts
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
      - run: npm run check:sdk
      - run: npm test
      - name: Test real SDK with synthetic transport (no API keys)
        run: npm run test:sdk
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: pi-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            dist/pi.zip
            dist/SHA256SUMS
            package-lock.json
          if-no-files-found: error
          retention-days: 14
