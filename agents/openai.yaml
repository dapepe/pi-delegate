interface:
  display_name: "pi"
  short_description: "Bounded Pi sub-agents review and implement; Codex decides what lands"
  default_prompt: "Use $pi to obtain independent model input, or to have a candidate change implemented in an isolated overlay. Choose the models, allocations and minimum permissions, verify the evidence yourself, apply only what you accept, and report what was useful and what Pi cost."
